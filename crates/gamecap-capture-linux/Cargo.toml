[package]
name = "gamecap-capture-linux"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "xdg-desktop-portal + PipeWire capture (Milestone M1)"

[dependencies]
ashpd = { version = "0.11.0", default-features = false, features = ["tokio"] }
gamecap-capture.workspace = true
gamecap-types.workspace = true
rustix = { version = "0.38", default-features = true, features = ["net"] }
tokio = { version = "1.40", default-features = false, features = ["rt", "time", "net", "io-util", "sync"] }

